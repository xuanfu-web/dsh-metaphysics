name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 构建产物须与源码同步
        run: |
          node tools/build-client.mjs
          git diff --exit-code -- client.js
      - name: 产物自检（宿主形态可编译可执行，逐模块定位）
        run: node tools/check-bundle.mjs
      - name: 跑全部回归
        run: node tools/test-all.mjs
      - name: 断言数不得低于基线
        run: node tools/check-assertions.mjs
      - name: 测试自检（故意写错的断言必须变红）
        run: node tools/verify-tests-can-fail.mjs
      - name: HTML 注入面扫描（innerHTML 拼接必须转义）
        run: node tools/check-html-sinks.mjs
      - name: 工程约定（engine 纯净性 / 日志 / var / 时间与随机源）
        run: node tools/check-patterns.mjs
