description:
  en: 'Chinese metaphysics (xuanxue) divination panel and agent tool with eighteen systems: eight chart systems (BaZi, Zi Wei Dou Shu, LiuYao, MeiHua, Da Liu Ren, Qi Men Dun Jia, compatibility charts, Tarot) plus ten quick references (almanac, solar–lunar conversion, date selection, bone-weight fortune, Xiao Liu Ren, horoscope, numerology, life-curve, feng shui, name analysis); ask-driven interpretation and a report layer. All computed locally; networking is off by default.'
  zh: '玄学命理排盘：十八套体系——八套排盘（八字、紫微斗数、六爻、梅花易数、大六壬、奇门遁甲、合盘、塔罗）加十套速查（黄历、农历互转、择日、称骨、小六壬、星座、生命数字、人生K线、风水、起名），并可按所问之事生成解析；纯本地计算，默认不联网。'
